<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>Sign in with Social Account</title>
  <style>
    .training-banner {
      position: sticky;
      top: 0; left: 0; right: 0;
      z-index: 2000;
      background: #b91c1c;
      color: #fff;
      padding: 12px 18px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .training-banner i { margin-right: 6px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 15px;
      padding: 40px 30px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeIn 0.7s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .social-logo {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .social-google { color: #dd4b39; }
    .social-facebook { color: #3B5998; }
    .social-microsoft { color: #0078d4; }
    .social-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e1e5e9;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 2px;
      background: #f8f9fa;
    }
    .input-group input:focus {
      outline: none;
      border-color: #4285f4;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #4285f4;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1967d2;
    }
    .back-link {
      display: block;
      margin-top: 18px;
      color: #666;
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }
    .fake-url {
      font-size: 13px;
      color: #888;
      margin-bottom: 18px;
      font-family: monospace;
      background: #f1f3f4;
      padding: 5px 10px;
      border-radius: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <!-- Gate: this simulation page only renders with a campaign token.
       Without one (e.g. a crawler or stray visitor), bounce to the
       benign educational landing page before anything paints. -->
  <script>
    (function () {
      var t = new URLSearchParams(window.location.search).get('c');
      if (!t || !t.trim()) { window.location.replace('index.html'); }
    })();
  </script>
  <div class="container" id="socialContainer" style="display:none">
    <div id="socialLogo" class="social-logo"></div>
    <div class="fake-url" id="fakeUrl"></div>
    <div class="social-title" id="socialTitle">Sign in</div>
    <form id="socialForm">
      <div class="input-group">
        <label id="labelUser" for="socialUser">Email or phone</label>
        <input type="text" id="socialUser" name="socialUser" required autocomplete="username">
      </div>
      <div class="input-group">
        <label id="labelPass" for="socialPass">Password</label>
        <input type="password" id="socialPass" name="socialPass" required autocomplete="current-password">
      </div>
      <input type="submit" class="btn" value="Sign in">
    </form>
    <span class="back-link" onclick="goBack()">Back to login</span>
  </div>
  <script>
    // Parse social type from query string
    const params = new URLSearchParams(window.location.search);
    const token = (params.get('c') || '').trim();
    // Require a campaign token; otherwise return to the educational page.
    if (!token) { window.location.replace('index.html'); }
    const social = params.get('social') || 'google';
    // Token present: reveal the simulation.
    document.getElementById('socialContainer').style.display = '';
    // Set up branding
    let logo = '', title = '', url = '', logoClass = '';
    if (social === 'google') {
      logo = '<i class="fa fa-google social-google"></i>';
      title = 'Sign in with Google';
      url = 'https://accounts.google.com/signin';
      logoClass = 'social-google';
    } else if (social === 'facebook') {
      logo = '<i class="fa fa-facebook social-facebook"></i>';
      title = 'Log in to Facebook';
      url = 'https://www.facebook.com/login.php';
      logoClass = 'social-facebook';
    } else if (social === 'microsoft') {
      logo = '<i class="fa fa-windows social-microsoft"></i>';
      title = 'Sign in to your Microsoft account';
      url = 'https://login.microsoftonline.com/';
      logoClass = 'social-microsoft';
    }
    document.getElementById('socialLogo').innerHTML = logo;
    document.getElementById('socialTitle').textContent = title;
    document.getElementById('fakeUrl').textContent = url;
    // Form submission
    document.getElementById('socialForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('socialUser').value;
      const pwLen = document.getElementById('socialPass').value.length;
      // Record ONLY the typed email and the password LENGTH in sessionStorage.
      // Credentials are never placed in the URL or sent to any server.
      try {
        sessionStorage.setItem('demo_email', user);
        sessionStorage.setItem('demo_pwlen', String(pwLen));
        sessionStorage.setItem('demo_method', social);
      } catch (err) { /* storage may be blocked; demo still works */ }
      // Simulate loading
      document.querySelector('.btn').value = 'Signing in...';
      document.querySelector('.btn').disabled = true;
      setTimeout(() => {
        window.location.href = 'hacked.html';
      }, 1200);
    });
    function goBack() {
      // Keep the campaign token so the user returns to the simulation, not the gate.
      window.location.href = 'index.html?c=' + encodeURIComponent(token);
    }
  </script>
</body>
</html>
